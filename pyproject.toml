[tool.ruff]
# Target Python 3.8
target-version = "py38"

# Include
include = ["*.py"]

# Exclude
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    ".venv",
    "venv",
    "workspace",
]

# Line length
line-length = 100

# Select rules
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "YTT",  # flake8-2020
    "ANN",  # flake8-annotations
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]

# Ignore rules
ignore = [
    "ANN101",  # missing-type-self (too noisy)
    "ANN102",  # missing-type-cls
    "ANN401",  # dynamically-typed expressions
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401", "I"]  # ignore unused imports and isort in __init__.py
"tests/**" = ["ANN", "N"]      # tests don't need annotations

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.mccabe]
max-complexity = 15
