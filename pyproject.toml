[project]
name = "sam"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "packaging>=26.2",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["."]
python_files = ["test_*.py"]
