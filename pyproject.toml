[tool.ruff]
target-version = "py38"
include = ["*.py"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    ".venv",
    "venv",
    "workspace",
]
line-length = 100

select = ["E", "W", "F", "I", "N", "UP", "YTT", "ANN", "SIM", "TCH"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401", "I"]
"tests/**" = ["ANN", "N", "SIM", "E501", "F841", "E741", "W293", "I001", "UP", "YTT", "TCH"]
"src/sam/**/__init__.py" = ["F401", "I", "ANN"]
"src/sam/**" = ["ANN", "SIM", "E501", "F841", "UP", "N", "YTT", "TCH", "W293", "I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.mccabe]
max-complexity = 15

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit"]
addopts = "--tb=short"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:pydantic",
    "ignore::PendingDeprecationWarning",
]
