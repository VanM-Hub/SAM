[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sam-ops"
version = "10.2.2"
description = "SAM — The Autonomous Guardian Operating System for AI"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "VanM", email = "vanmalaka@gmail.com"},
]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "structlog>=21.0",
    "pydantic>=1.10,<3",
]

[project.optional-dependencies]
console = [
    "rich>=12.0",
    "typer>=0.9",
    "pyyaml>=6.0",
    "aiosqlite>=0.19",
    "anyio>=4",
]
desktop = [
    "PySide6>=6.5",
]
server = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "httpx>=0.24",
    "jinja2>=3.0",
]
all = [
    "sam-ops[console,desktop,server]",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.3",
    "build>=1.0",
    "wheel>=0.40",
    "setuptools>=64",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/VanM-Hub/SAM"
Repository = "https://github.com/VanM-Hub/SAM"
Documentation = "https://github.com/VanM-Hub/SAM#readme"

[project.scripts]
sam = "sam.launcher.cli_entry:sam_main"
sam-console = "sam.launcher.cli_entry:console_main"
sam-desktop = "sam.launcher.cli_entry:desktop_main"
sam-headless = "sam.launcher.cli_entry:headless_main"
sam-diagnostic = "sam.launcher.cli_entry:diagnostic_main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sam*"]
exclude = []

[tool.setuptools.package-data]
"sam.contracts" = ["*.json"]
"sam.data" = ["*.sql", "*.json"]

[tool.ruff]
target-version = "py38"
include = ["*.py"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    ".venv",
    "venv",
    "workspace",
    ".mypy_cache",
    ".ruff_cache",
    ".pytest_cache",
]
line-length = 100

select = ["E", "W", "F", "I", "N", "UP", "YTT", "ANN", "SIM", "TCH"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401", "I"]
"tests/**" = ["ANN", "N", "SIM", "E501", "F841", "E741", "W293", "I001", "UP", "YTT", "TCH"]
"src/sam/**/__init__.py" = ["F401", "I", "ANN"]
"src/sam/**" = ["ANN", "SIM", "E501", "F841", "UP", "N", "YTT", "TCH", "W293", "I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.mccabe]
max-complexity = 15

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit"]
addopts = "--tb=short"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:pydantic",
    "ignore::PendingDeprecationWarning",
]
