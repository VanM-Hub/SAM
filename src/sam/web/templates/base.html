<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SAM Operations Console{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #0a0a0f; color: #e0e0e0; min-height: 100vh; display: flex; }
        nav { width: 220px; background: #12121a; padding: 24px 16px; border-right: 1px solid #2a2a3a; height: 100vh; position: sticky; top: 0; flex-shrink: 0; }
        nav h1 { font-size: 20px; margin-bottom: 32px; color: #fff; letter-spacing: 1px; }
        nav a { display: block; padding: 10px 14px; color: #a0a0b0; text-decoration: none; border-radius: 8px; margin-bottom: 4px; transition: 0.2s; font-size: 14px; }
        nav a:hover { background: #1e1e2e; color: #fff; }
        nav a.active { background: #2a2a4a; color: #fff; }
        main { flex: 1; padding: 32px; overflow-y: auto; max-height: 100vh; }
        .card { background: #12121a; border: 1px solid #2a2a3a; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .card h2 { font-size: 16px; color: #a0a0b0; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.5px; }
        .card h3 { font-size: 14px; color: #ccc; margin-bottom: 8px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
        .stat { background: #1a1a2a; padding: 16px; border-radius: 8px; border-left: 4px solid #4a6a9a; }
        .stat .label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat .value { font-size: 28px; font-weight: 600; margin-top: 4px; color: #fff; }
        .stat .sub { font-size: 12px; color: #888; margin-top: 2px; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 500; }
        .badge.healthy, .badge.completed, .badge.approved { background: #1a3a2a; color: #6ae06a; }
        .badge.degraded, .badge.running, .badge.executing { background: #1a2a3a; color: #6aaae0; }
        .badge.warning, .badge.pending, .badge.medium { background: #3a3a1a; color: #e0c06a; }
        .badge.critical, .badge.high, .badge.failed, .badge.denied { background: #3a1a1a; color: #e06a6a; }
        .badge.low { background: #1a2a1a; color: #6ae06a; }
        table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
        th { text-align: left; padding: 8px 12px; border-bottom: 1px solid #2a2a3a; color: #888; font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
        td { padding: 8px 12px; border-bottom: 1px solid #1a1a2a; }
        tr:hover { background: #1a1a2a; }
        .btn { padding: 6px 16px; border: none; border-radius: 6px; background: #2a4a6a; color: #fff; cursor: pointer; font-size: 12px; font-weight: 500; }
        .btn:hover { background: #3a5a7a; }
        .btn.danger { background: #6a2a2a; }
        .btn.danger:hover { background: #8a3a3a; }
        .progress-bar { background: #2a2a3a; border-radius: 20px; height: 6px; overflow: hidden; margin-top: 4px; }
        .progress-fill { height: 100%; background: #4a6a9a; border-radius: 20px; transition: width 0.3s; }
        pre { background: #1a1a2a; padding: 16px; border-radius: 8px; font-size: 12px; overflow-x: auto; color: #c0c0d0; font-family: 'Courier New', monospace; max-height: 400px; }
        .input { background: #1a1a2a; border: 1px solid #2a2a3a; padding: 8px 12px; border-radius: 6px; color: #fff; width: 100%; margin-bottom: 12px; }
        .flex { display: flex; gap: 12px; align-items: center; }
        .mt-4 { margin-top: 16px; }
        .mb-4 { margin-bottom: 16px; }
        .text-center { text-align: center; }
        .text-muted { color: #888; font-size: 12px; }
        .empty-state { padding: 40px; text-align: center; color: #666; font-size: 14px; }
    </style>
</head>
<body>

<nav>
    <h1>⚙️ SAM</h1>
    <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">🏠 Dashboard</a>
    <a href="/runtime" class="{% if request.url.path == '/runtime' %}active{% endif %}">🖥️ Runtime</a>
    <a href="/workflow" class="{% if request.url.path == '/workflow' %}active{% endif %}">📋 Workflow</a>
    <a href="/incidents" class="{% if request.url.path == '/incidents' %}active{% endif %}">🚨 Incidents</a>
    <a href="/autonomous" class="{% if request.url.path == '/autonomous' %}active{% endif %}">🤖 Autonomous</a>
    <a href="/openclaw" class="{% if request.url.path == '/openclaw' %}active{% endif %}">🔌 OpenClaw</a>
    <a href="/knowledge" class="{% if request.url.path == '/knowledge' %}active{% endif %}">🧠 Knowledge</a>
    <a href="/settings" class="{% if request.url.path == '/settings' %}active{% endif %}">⚙️ Settings</a>
</nav>

<main>
    {% block content %}{% endblock %}
</main>

</body>
</html>
