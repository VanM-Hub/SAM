name: Auto Rerun CI (triggered)

on:
  push:
    branches: [ main ]

jobs:
  auto_rerun:
    if: contains(github.event.head_commit.message, '[rerun-ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Show context
        run: |
          echo "Auto-rerun triggered by commit: ${{ github.event.head_commit.id }}"
          echo "Commit message: ${{ github.event.head_commit.message }}"

      - name: Rerun failed jobs for target run
        env:
          GHTOKEN: *** secrets.ZARA-TOKKEN }}
        run: |
          set -euo pipefail
          # Ganti RUN_ID jika ingin target run lain
          RUN_ID=30554633394
          echo "Requesting rerun-failed-jobs for run $RUN_ID"
          http_code=$(curl -s -o /dev/stderr -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GHTOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/VanM-Hub/SAM/actions/runs/${RUN_ID}/rerun-failed-jobs")
          echo "GitHub API status: $http_code"
          if [ "$http_code" -ne "201" ] && [ "$http_code" -ne "202" ]; then
            echo "Warning: API returned non-success status code $http_code" >&2
            exit 1
          fi
          echo "Rerun requested (status $http_code)"