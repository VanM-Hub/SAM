name: SAM CI

on:
  push:
    branches: [main, 'sprint-**']
  pull_request:
    branches: [main]

env:
  PYTHONPATH: ${{ github.workspace }}/src

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,console]"

      - name: Lint with Ruff
        run: |
          python -m ruff check src/ --quiet --exit-zero

      - name: Run pytest (all unit tests, headless mode)
        run: |
          python -m pytest tests/unit/ \
            --tb=short \
            --cov=src \
            --cov-report=term-missing \
            --cov-fail-under=5 \
            -q

  desktop:
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system deps (Qt)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxcb-cursor0 libegl1-mesa libgl1-mesa-glx

      - name: Install dependencies (with desktop)
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,desktop]"

      - name: Run desktop smoke tests
        run: |
          QT_QPA_PLATFORM=offscreen python -m pytest tests/unit/test_desktop_smoke.py -v --tb=short

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

  summary:
    needs: [core, desktop]
    runs-on: ubuntu-latest
    steps:
      - run: echo "SAM CI - all checks passed"
