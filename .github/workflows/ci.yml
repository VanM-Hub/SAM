name: SAM CI

on:
  push:
    branches: [main, 'sprint-**']
  pull_request:
    branches: [main]

env:
  PYTHONPATH: ${{ github.workspace }}/src

jobs:
  ########################################################################
  # CORE — unit tests tanpa Qt dependencies
  ########################################################################
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel setuptools
          # Hanya install dev + console (tanpa desktop/Qt)
          pip install ".[dev,console]"
          pip list

      - name: Lint with Ruff
        run: |
          pip install ruff
          ruff check src/ --quiet --exit-zero
          ruff format --check src/ || echo 'Format check non-fatal for now'

      - name: Run core tests (headless)
        run: |
          python -m pytest tests/unit/ \
                       -k "not desktop and not web_server and not web_default_host and not test_load_from_workspace and not test_server_root_endpoint" \
                       --tb=short \
                       --cov=src/sam/telemetry \
                       --cov=src/sam/operations \
                       --cov=src/sam/experience \
                       --cov-report=term-missing \
                       --cov-fail-under=5

  ########################################################################
  # DESKTOP — smoke test dengan Qt (hanya Python 3.11 untuk efisiensi)
  ########################################################################
  desktop:
    needs: core
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps (Qt)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxcb-cursor0 libegl1-mesa libgl1-mesa-glx qt6-base-dev

      - name: Install all dependencies (including desktop)
        run: |
          python -m pip install --upgrade pip
          pip install build wheel setuptools
          pip install ".[dev,desktop]"
          pip list

      - name: Import isolation - desktop domain check
        run: |
          BAD=$(python3 -c "
import os
qt = 'src/sam/operations/presentation/desktop/qt'
bad = []
for f in sorted(os.listdir(qt)):
    if not f.endswith('.py') or f == '__init__.py':
        continue
    text = open(os.path.join(qt, f)).read()
    for line in text.splitlines():
        s = line.strip()
        if not s.startswith(('import', 'from')):
            continue
        if any(x in s for x in ['sam.storage', 'sam.domain', 'sam.api',
                                 'sam.mission.', 'sam.strategy.',
                                 'sam.telemetry.', 'sam.autonomous.',
                                 'sam.operations.']):
            if 'sam.operations.presentation' not in s and \
               'sam.operations.summary_builder' not in s:
                bad.append(f'{f}: {s}')
            if 'sam.operations.conversation' in s:
                bad.append(f'{f}: {s}')
if bad:
    print('Bad imports:')
    for b in bad:
        print(f'  {b}')
    exit(1 if bad else 0)
")
          if [ -n "$BAD" ]; then echo "Failed"; exit 1; fi
          echo "0 domain/repo/api imports"

      - name: Run Qt Desktop smoke tests
        run: |
          QT_QPA_PLATFORM=offscreen python tests/unit/test_desktop_smoke.py -v

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-desktop
          path: .coverage

  ########################################################################
  # SUMMARY
  ########################################################################
  summary:
    needs: [core, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: echo "SAM CI - core + desktop smoke tests passed"
